
name: Pipeline CI - Gerenciamento Mercado

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Preparar Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar e executar testes
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
